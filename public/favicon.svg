<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0DEC8"/>
      <stop offset="45%" stop-color="#C4A070"/>
      <stop offset="100%" stop-color="#9E7939"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#1C1816"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#C4A070" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Intertwined Atelier Monogram Ribbon Motif -->
  <g filter="url(#softGlow)" transform="translate(60, 60)">
    <!-- Loop 1: Upper Left to Lower Right -->
    <path d="M-18,-24 C-32,-10 -30,16 -12,25 C4,32 18,22 24,6 C30,-10 18,-28 0,-24 C-10,-22 -22,-6 -14,14 C-8,28 14,30 22,12 C28,-2 14,-22 -4,-20" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Loop 2: Upper Right to Lower Left Interlocking -->
    <path d="M16,-22 C30,-8 28,18 10,26 C-6,32 -20,20 -24,4 C-28,-12 -14,-28 4,-24 C14,-22 24,-4 14,16 C6,30 -16,28 -22,10" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
